name: Fetch AI News

# Runs the news pipeline on GitHub's runners instead of Vercel — the Vercel
# crons were removed for Hobby-plan/cost reasons, and hitting the Vercel route
# from outside would still bill Vercel fluid compute for a ~5 minute function.
# Every 6 hours with a long budget, rather than often with a short one. A run
# spends ~3.5 min collecting and fact-checking before it can write anything, so
# that cost is paid per run no matter how little writing follows: 8 short runs
# a day published 1 article each, while 4 long ones reach the 8-article cap.
# Billed minutes work out to roughly (budget + 2.4) per run — 4 x 14.4 x 31 is
# ~1,786 against the 2,000 free private-repo minutes.
#
# Minute 17, not 0: GitHub queues scheduled workflows behind everyone else's,
# and the top of the hour is the worst of it — the 03:00 slot landed at 05:10.
# An odd minute sits outside the crowd and tends to start closer to on time.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Backstop only — the pipeline's own time budget below is what normally
    # ends a run. Kept just above budget + tail so a hung run can't eat the
    # monthly minute budget.
    timeout-minutes: 18
    steps:
      # Sparse checkout + a 4-package install instead of `npm ci` on the whole
      # Next app: billed minutes are wall-clock, so keeping setup near zero is
      # what keeps 12 runs/day inside the free tier.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lib
            scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Versions pinned to package.json so runner output matches what Vercel
      # produced — same deps, same pipeline, same article quality.
      - name: Install pipeline deps
        run: npm i --no-save --no-audit --no-fund @libsql/client@^0.17.4 openai@^6.44.0 rss-parser@^3.13.0 uuid@^14.0.0 tsx@^4.19.2

      - name: Run news pipeline
        run: npx tsx scripts/run-news-pipeline.ts
        env:
          # Stop starting new articles after 12 min and exit cleanly; the job
          # timeout above is only a backstop, not the normal way a run ends.
          PIPELINE_TIME_BUDGET_MS: '720000'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEXT_PUBLIC_SITE_URL: https://thinksuite.in
          # Auto-provided by Actions; enough for the GitHub-releases collector.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
